schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Tiered SDD Cycle"
  version: "1.1.0"
  author: "fons4cloud"
  description: "Runs tiered SDD flow: S0 specify-only, S1 specify -> plan -> tasks -> implement, S2 full governance"

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["codex", "copilot", "claude", "gemini"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "codex"
    prompt: "Integration to use (e.g. codex, claude, copilot, gemini)"
  sdd_level:
    type: string
    default: "S1"
    enum: ["S0", "S1", "S2"]
    prompt: "Choose SDD level: S0 lightweight, S1 standard, S2 complex"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only", "docs-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} SDD_LEVEL={{ inputs.sdd_level }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec and SDD level before continuing. S0 stops after approved spec and implementation confirmation."
    options: [approve, reject]
    on_reject: abort

  - id: s0-stop
    type: gate
    when: "{{ inputs.sdd_level == 'S0' }}"
    message: "S0 lightweight flow: plan/tasks/checklist are skipped. Implement only after the single spec records facts, AC, impact, execution checklist, verification plan, and required user confirmation."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    when: "{{ inputs.sdd_level != 'S0' }}"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} SDD_LEVEL={{ inputs.sdd_level }}"

  - id: review-plan
    type: gate
    when: "{{ inputs.sdd_level != 'S0' }}"
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    when: "{{ inputs.sdd_level != 'S0' }}"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} SDD_LEVEL={{ inputs.sdd_level }}"

  - id: checklist
    command: speckit.checklist
    when: "{{ inputs.sdd_level == 'S2' }}"
    integration: "{{ inputs.integration }}"
    input:
      args: "S2 complex capability governance checklist for {{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} SDD_LEVEL={{ inputs.sdd_level }}"
